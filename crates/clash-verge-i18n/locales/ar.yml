_version: 1
notifications:
  networkDown:
    title: You're offline
    body: Check your Wi-Fi or cable.
  nodeDown:
    title: Node is down
    body: Sites outside the mainland won't load. Try another node.
  nodeRecovered:
    title: Connection restored
    body: Your node is working again.
  aiNodeDown:
    title: AI node is down
    body: Claude and ChatGPT won't load for now.
  aiNodeMissing:
    title: AI node is gone
    body: It's no longer in your subscription. AI uses the main node.
  aiNodeRecovered:
    title: AI node is back
    body: Claude and ChatGPT work again.
  dashboardToggled:
    title: لوحة التحكم
    body: تم تحديث حالة عرض لوحة التحكم.
  clashModeChanged:
    title: تبديل الوضع
    body: تم التبديل إلى {mode}.
  systemProxyToggled:
    title: وكيل النظام
    'on': System proxy has been enabled.
    'off': System proxy has been disabled.
  systemProxyFailed:
    title: وكيل النظام
    body: تعذّر ضبط وكيل النظام. افتح Openn لمعرفة السبب.
  systemProxyGuardStopped:
    title: حارس وكيل النظام
    body: توقف بعد عدة إخفاقات متتالية. افتح Openn لمعرفة السبب.
  tunModeToggled:
    title: وضع TUN
    'on': TUN mode has been enabled.
    'off': TUN mode has been disabled.
  lightweightModeEntered:
    title: الوضع الخفيف
    body: تم الدخول إلى الوضع الخفيف.
  profilesReactivated:
    title: الملفات التعريفية
    body: تمت إعادة تفعيل الملف التعريفي.
  appQuit:
    title: على وشك الخروج
    body: Openn على وشك الخروج.
  appHidden:
    title: تم إخفاء التطبيق
    body: Openn يعمل في الخلفية.
  updateReady:
    title: Openn Update
    body: A new version (v{version}) has been downloaded and is ready to install.
    installNow: Install Now
    later: Later
service:
  adminInstallPrompt: يتطلب تثبيت خدمة Openn صلاحيات المسؤول.
  adminUninstallPrompt: يتطلب إلغاء تثبيت خدمة Openn صلاحيات المسؤول.
