_version: 1
notifications:
  networkDown:
    title: You're offline
    body: Check your Wi-Fi or cable.
  nodeDown:
    title: Node is down
    body: Sites outside the mainland won't load. Try another node.
  nodeRecovered:
    title: Connection restored
    body: Your node is working again.
  aiNodeDown:
    title: AI node is down
    body: Claude and ChatGPT won't load for now.
  aiNodeMissing:
    title: AI node is gone
    body: It's no longer in your subscription. AI uses the main node.
  aiNodeRecovered:
    title: AI node is back
    body: Claude and ChatGPT work again.
  dashboardToggled:
    title: Идарә панеле
    body: Идарә панеленең күренеше яңартылды.
  clashModeChanged:
    title: Режим алыштыру
    body: '{mode} режимына күчтел.'
  systemProxyToggled:
    title: Системалы прокси
    'on': System proxy has been enabled.
    'off': System proxy has been disabled.
  systemProxyFailed:
    title: Система проксие
    body: Система проксиен көйләп булмады. Сәбәбен күрер өчен Openn'ны ачыгыз.
  systemProxyGuardStopped:
    title: Система проксие сакчысы
    body: Берничә тапкыр рәттән уңышсыз булгач туктады. Сәбәбен күрер өчен Openn'ны ачыгыз.
  tunModeToggled:
    title: TUN режимы
    'on': TUN mode has been enabled.
    'off': TUN mode has been disabled.
  lightweightModeEntered:
    title: Җиңел режим
    body: Җиңел режимга күчелде.
  profilesReactivated:
    title: Профильләр
    body: Профиль яңадан активлаштырылды.
  appQuit:
    title: Чыгар алдыннан
    body: Openn чыгарга җыена.
  appHidden:
    title: Кушымта яшерелде
    body: Openn фон режимында эшли.
  updateReady:
    title: Openn Update
    body: A new version (v{version}) has been downloaded and is ready to install.
    installNow: Install Now
    later: Later
service:
  adminInstallPrompt: Openn хезмәтен урнаштыру өчен администратор хокуклары кирәк.
  adminUninstallPrompt: Openn хезмәтен бетерү өчен администратор хокуклары кирәк.
