[package]
name = "clash-verge-i18n"
version = "0.1.0"
edition = "2024"

[dependencies]
rust-i18n = "4.2.2"
sys-locale = "0.3.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", features = [
  "NSString",
  "NSDictionary",
  "NSArray",
  "NSUserDefaults",
] }

[lints]
workspace = true
