name: Release

# A version tag builds the macOS app into a draft GitHub release; a manual run only builds it and
# keeps the bundle as a workflow artifact.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-latest
    env:
      TARGET: aarch64-apple-darwin
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Checkout Openn
        uses: actions/checkout@v7
        with:
          path: openn

      # scripts/prebuild.mjs compiles the privileged service from the sibling service fork.
      - name: Checkout Openn service
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/openn-service
          ref: openn
          path: clash-verge-service-ipc

      - name: Check tag matches version
        if: env.IS_TAG == 'true'
        working-directory: openn
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.1'
          targets: ${{ env.TARGET }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            openn -> target
            clash-verge-service-ipc -> target

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: openn/package.json
          run_install: false

      - name: Install dependencies and sidecars
        working-directory: openn
        run: |
          pnpm i
          pnpm run prebuild $TARGET

      - name: Build
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: openn
          tauriScript: pnpm
          # Updater artifacts stay off in tauri.conf.json so local builds do not need the private key.
          args: --target ${{ env.TARGET }} --config '{"bundle":{"createUpdaterArtifacts":true}}'
          tagName: ${{ env.IS_TAG == 'true' && github.ref_name || '' }}
          releaseName: Openn ${{ github.ref_name }}
          releaseBody: See Changelog.md for this version.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: true

      - name: Upload bundle
        if: env.IS_TAG != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: openn-${{ env.TARGET }}
          path: openn/target/${{ env.TARGET }}/release/bundle/dmg/*.dmg
          retention-days: 14
